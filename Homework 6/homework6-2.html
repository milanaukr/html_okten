<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body{
            height: 100vh;
            background-color: darkcyan;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: arial, sans-serif;
        }
        .registration-block{
            width: 50vw;
            height: 50vh;
            background-color: white;
            border-radius: 20px;

        }
        .registration-block div:nth-child(1){
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 139, 139, 0.20);
            height: 20%;
        }
        .registration-block div:nth-child(1) h2{
            font-size: 30px;
            font-weight: 400;
        }
        .registration-block div{
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
        }
        .register {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        input[type=text],
        input[type=password]{
            width: 300px;
            margin: 15px;
            height: 30px;
        }
        .registration-block .register .remember{
            width: 300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: row;
        }
        form input[type=submit]{
            width: 80px;
            background-color: rgba(0, 139, 139, 0.24);
            border-radius: 10px;
            border: 1px solid grey;
            height: 25px;
        }
    </style>
</head>
<body>

<div class="registration-block">

    <div class="text">
        <h2>Login to personal account</h2>
    </div>

    <form class="register">
        <input type="text" name="name" id="enter-name-email" placeholder="Login or email" required>

        <input type="password" name="password" id="enter-password" placeholder="Password" required>

        <div class="remember">
            <label>
                <input type="checkbox" name="remember" value="yes">
                Remember me
            </label>

            <input type="submit" value="Login">
        </div>




    </form>
</div>

</body>
</html>
