<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        nav{
            width: 100vw;
            height: 4vh;
            background: #D9D9D9;
        }
        main{
            height: 74vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        section{
            width: 59vw;
            height: 100%;
            background: #A4A4A4;

        }
        .aside{
            display: flex;
            flex-direction: column;
        }
        .aside .aside-top{
            height: 40vh;
            width: 41vw;
            background: #7F7A7A;
        }
        .aside .aside-bottom{
            height: 34vh;
            width: 41vw;
            background: #615050;
        }
        footer .footer-top{
            height: 10vh;
            background: #D9D9D9;
        }
        footer .footer-bottom{
            height: 12vh;
            background: #AFA9A9;
        }
    </style>
</head>
<body>
<nav></nav>

<main>
    <section></section>
    <div class="aside">
        <div class="aside-top"></div>
        <div class="aside-bottom"></div>
    </div>
</main>

<footer>
    <div class="footer-top"></div>
    <div class="footer-bottom"></div>
</footer>
</body>
</html>
