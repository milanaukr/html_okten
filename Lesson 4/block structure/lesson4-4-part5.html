<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        header{
            width: 100%;
            height: 4vh;
            background: #D9D9D9;
        }
        main{
            height: 86vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .aside-left{
            width: 29vw;
            height: 100%;
            background: #A4A4A4;
        }
        .middle{
            width: 31vw;
            height: 100%;
            background: #C1C1C1;
        }
        .aside-right{
            width: 40vw;
            display: flex;
            flex-direction: column;
        }

        .aside-right .aside-right-top{
            height: 43vh;
            background: #7F7A7A;
        }

        .aside-right .aside-right-bottom{
            height: 43vh;
            background: #6B6161;
        }
        footer{
            height: 10vh;
            width: 100%;
            background: #D9D9D9;
        }
    </style>
</head>
<body>
<header></header>

<main>
    <div class="aside-left"></div>
    <div class="middle"></div>
    <div class="aside-right">
        <div class="aside-right-top"></div>
        <div class="aside-right-bottom"></div>
    </div>
</main>

<footer></footer>
</body>
</html>
