<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        header, footer{
            width: 100vw;
            height: 22vh;
            background: #D9D9D9;
        }
        main{
            height: 56vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        aside{
            height: 100%;
            width: 27vw;
            background: #C0BDBD;
        }
        section{
            height: 100%;
            width: 46vw;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

        }
        top{
            height: 26vh;
            width: 100%;
            background: #827878;
        }
        bottom{
            height: 30vh;
            width: 100%;
            background: #B7ADAD;
        }
    </style>
</head>
<body>
<header></header>

<main>
    <aside></aside>

    <section>
        <top></top>
        <bottom></bottom>
    </section>

    <aside></aside>
</main>

<footer></footer>
</body>
</html>
