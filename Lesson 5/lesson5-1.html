<head>

        @keyframes lorem{
            0%{
                transform: translate(300px, 300px);
            }
            /*50%{*/
            /*    border-radius: 20%;*/
            /*    transform: skew(0deg);*/
            /*}*/
            100%{
                background-color: #ffa5c3;
            }
        }

<div class="pink-box"></div>
</body>
